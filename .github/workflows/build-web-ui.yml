name: build-web-ui

# Builds the standalone VoiceStudio web client and publishes it two ways:
#   1. web-dist artifact (used for the Netlify deploy)
#   2. GitHub Pages (public, ungated)
# Runs on GitHub's runners because the build needs more RAM than small CI boxes have.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-web-ui.yml'

permissions:
  contents: read

jobs:
  build-web-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        working-directory: electron
        run: bun install

      - name: Build web client
        working-directory: electron
        run: bun run build:web

      - name: Show build output
        run: ls -la frontend/dist && du -sh frontend/dist

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 3

  deploy-pages:
    needs: build-web-ui
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        working-directory: electron
        run: bun install

      # Project Pages live under a subpath, so assets must build relative to it.
      - name: Build web client for subpath hosting
        working-directory: electron
        run: bunx vite build --config vite.web.config.ts --base=/VoiceStudio/

      # Pages has no rewrites: 404.html is the SPA fallback for deep links.
      - name: Prepare SPA fallback
        working-directory: electron
        run: |
          cp ../frontend/dist/index.html ../frontend/dist/404.html
          touch ../frontend/dist/.nojekyll
          ls -la ../frontend/dist | head

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
